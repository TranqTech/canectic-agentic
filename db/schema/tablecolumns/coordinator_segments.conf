id SERIAL PRIMARY KEY
network_id INTEGER NOT NULL
name VARCHAR(128) NOT NULL
role VARCHAR(16) NOT NULL DEFAULT 'NC'
zone INTEGER NOT NULL
region INTEGER DEFAULT 0
net INTEGER DEFAULT 0
hub_node INTEGER DEFAULT 0
upstream_address VARCHAR(64)
upstream_connection_id INTEGER
stub_filename VARCHAR(32)
distribution_method VARCHAR(16) DEFAULT 'manual'
schedule VARCHAR(64) DEFAULT 'manual'
description TEXT
active BOOLEAN DEFAULT true
parent_segment_id INTEGER
source VARCHAR(16) NOT NULL DEFAULT 'internal'
stub_file_area VARCHAR(255)
depth INTEGER NOT NULL DEFAULT 0
last_generated_at TIMESTAMPTZ
created_at TIMESTAMPTZ DEFAULT NOW()
updated_at TIMESTAMPTZ
