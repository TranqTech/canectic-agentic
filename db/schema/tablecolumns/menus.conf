id                    SERIAL PRIMARY KEY
name                  VARCHAR(64) UNIQUE
title                 VARCHAR(128)
menu_type             VARCHAR(32) DEFAULT 'Hotkey'
display_title         BOOLEAN DEFAULT true
display_entries       VARCHAR(8) DEFAULT 'auto'
display_file          VARCHAR(128)
display_file_type     VARCHAR(32)
margin_top            INTEGER DEFAULT 3
margin_bottom         INTEGER DEFAULT 3
margin_left           INTEGER DEFAULT 2
margin_right          INTEGER DEFAULT 2
fill_order            VARCHAR(8) DEFAULT 'columns'
center_vertical       BOOLEAN DEFAULT false
max_columns           INTEGER DEFAULT 3
col_gap               INTEGER DEFAULT 2
title_clr             INTEGER
input_clr             INTEGER
prompt_clr            INTEGER
error_clr             INTEGER
hotkey_clr            INTEGER
menu_prompt_clr       INTEGER
featured_clr          INTEGER
created_at            TIMESTAMP DEFAULT NOW()
updated_at            TIMESTAMP DEFAULT NOW()
