id                    SERIAL PRIMARY KEY
name                  VARCHAR(64) UNIQUE
title                 VARCHAR(128)
menu_type             VARCHAR(32) DEFAULT 'Hotkey'
display_entries       BOOLEAN DEFAULT true
display_file          VARCHAR(128)
display_file_type     VARCHAR(32)
entries_x_offset      INTEGER DEFAULT 0
entries_y_offset      INTEGER DEFAULT 0
max_columns           INTEGER DEFAULT 3
col_gap               INTEGER DEFAULT 2
title_clr             INTEGER
input_clr             INTEGER
prompt_clr            INTEGER
error_clr             INTEGER
hotkey_clr            INTEGER
created_at            TIMESTAMP DEFAULT NOW()
updated_at            TIMESTAMP DEFAULT NOW()
