id                    SERIAL PRIMARY KEY
slug                  VARCHAR(64) UNIQUE NOT NULL
name                  VARCHAR(128) NOT NULL
cmd                   VARCHAR(256)
door_script           VARCHAR(256)
door_dir              VARCHAR(512)
door_args             JSONB
launch_type           VARCHAR(32) NOT NULL DEFAULT 'NativeShell'
dropfile_type         VARCHAR(32)
dropfile_dir          VARCHAR(512)
db_subdir             VARCHAR(128)
usereal_local         BOOLEAN DEFAULT false
usereal_doorsession   BOOLEAN DEFAULT false
pause_on_exit         BOOLEAN DEFAULT true
fixed_size            BOOLEAN DEFAULT false
max_nodes             INTEGER DEFAULT 0
active                BOOLEAN DEFAULT true
sort_order            INTEGER DEFAULT 0
description           TEXT
long_desc             TEXT
long_desc_html        TEXT
icon_url              VARCHAR(512)
created_at            TIMESTAMP DEFAULT NOW()
updated_at            TIMESTAMP DEFAULT NOW()
