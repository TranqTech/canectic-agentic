# Fail2ban jails for Canectic BBS.
#
# Install: copy to /etc/fail2ban/jail.d/canectic.conf
# Adjust logpath to match your installation's log directory.
# Restart fail2ban: sudo systemctl restart fail2ban
#
# Test filters:
#   fail2ban-regex /opt/canectic/logs/production/security.log /etc/fail2ban/filter.d/canectic-honeypot.conf
#   fail2ban-regex /opt/canectic/logs/production/security.log /etc/fail2ban/filter.d/canectic-auth.conf

# Honeypot: instant ban on known-bad usernames (root, admin, etc.)
# One attempt = ban. Zero false positive risk.
[canectic-honeypot]
enabled  = true
filter   = canectic-honeypot
logpath  = /opt/canectic/logs/production/security.log
maxretry = 1
findtime = 86400
bantime  = 86400
action   = iptables-multiport[name=canectic, port="23,2023,22,80,443"]

# Auth failures: brute force protection (optional, higher threshold)
# Disable this jail if you experience unwanted blocking of real users.
[canectic-auth]
enabled  = false
filter   = canectic-auth
logpath  = /opt/canectic/logs/production/security.log
maxretry = 10
findtime = 600
bantime  = 3600
action   = iptables-multiport[name=canectic, port="23,2023,22,80,443"]
