# Fail2ban filter for Canectic BBS failed login attempts.
#
# Matches failed password attempts and unknown username attempts.
# Use a higher threshold than the honeypot filter to avoid blocking
# users who mistype their password.
#
# Install: copy to /etc/fail2ban/filter.d/canectic-auth.conf
# Then add the jail from jail.d/canectic.conf

[Definition]
failregex = \[AUTHFAIL\] (?:Failed login for|Login attempt for unknown user) ".*" from <HOST>
ignoreregex =
