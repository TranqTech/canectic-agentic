# Fail2ban filter for Canectic BBS honeypot login attempts.
#
# Matches login attempts with known-bad usernames (root, admin, etc.)
# These are never legitimate BBS users -- one attempt = ban.
#
# Install: copy to /etc/fail2ban/filter.d/canectic-honeypot.conf
# Then add the jail from jail.d/canectic.conf

[Definition]
failregex = \[HONEYPOT\] Login attempt with banned username ".*" from <HOST>
ignoreregex =
