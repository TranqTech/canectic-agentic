<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lumina Flux</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>body {margin: 0; overflow: hidden;}</style>
</head>
<body>
    <script>
        let particles = [];
        let touchPoints = [];
        let bgHue = 0;
        let audioContext;
        let analyser;
        let microphone;
        let audioData;
        let lastTap = 0;


        function setup() {
            createCanvas(windowWidth, windowHeight);
            colorMode(HSB, 360, 100, 100, 1);
            noStroke();
            
            // Create initial particles
            for (let i = 0; i < 120; i++) {
                particles.push(new Particle());
            }
            
            // Audio setup (user-initiated)
            try {
                audioContext = new (window.AudioContext || webkitAudioContext)();
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        microphone = audioContext.createMediaStreamSource(stream);
                        analyser = audioContext.createAnalyser();
                        microphone.connect(analyser);
                        analyser.fftSize = 256;
                        audioData = new Uint8Array(analyser.frequencyBinCount);
                    })
                    .catch(() => {});
            } catch (e) {}
            
            // Handle window resize
            window.addEventListener('resize', () => {
                resizeCanvas(windowWidth, windowHeight);
            });
        }


        function draw() {
            // Slow background transition
            bgHue = (bgHue + 0.05) % 360;
            background(bgHue, 30, 5, 0.1);
            
            // Update audio reactivity
            if (analyser) {
                analyser.getByteFrequencyData(audioData);
            }
            
            // Update touch points
            for (let i = touchPoints.length - 1; i >= 0; i--) {
                const tp = touchPoints[i];
                tp.lifespan -= 0.02;
                if (tp.lifespan <= 0) touchPoints.splice(i, 1);
            }
            
            // Update and display particles
            for (let p of particles) {
                // Apply audio reactivity
                if (analyser) {
                    const energy = audioData[Math.floor(map(p.pos.x, 0, width, 0, audioData.length-1))] / 256;
                    p.applyAudioEnergy(energy);
                }
                
                // Apply touch interactions
                for (let tp of touchPoints) {
                    const d = dist(p.pos.x, p.pos.y, tp.x, tp.y);
                    if (d < 200) {
                        const force = map(d, 0, 200, 0.2, 0);
                        p.applyForce(p5.Vector.sub(p.pos, tp).normalize().mult(force));
                    }
                }
                
                p.update();
                p.display();
            }
            
            // Draw touch points
            for (let tp of touchPoints) {
                drawingContext.shadowBlur = 20;
                drawingContext.shadowColor = `hsla(200, 100%, 70%, ${tp.lifespan})`;
                fill(200, 100%, 80%, tp.lifespan * 0.7);
                ellipse(tp.x, tp.y, tp.size * tp.lifespan);
                drawingContext.shadowBlur = 0;
            }
            
            // Add new particles when tapping
            if (touchPoints.length > 0 && frameCount % 3 === 0) {
                particles.push(new Particle(touchPoints[0].x, touchPoints[0].y));
            }
        }


        function touchStarted() {
            // Prevent scrolling
            if (touches.length > 0) {
                preventDefault();
                
                // Double-tap for surprise effect
                if (millis() - lastTap < 300) {
                    createSurprise();
                }
                lastTap = millis();
                
                // Create new touch point
                for (let i = 0; i < touches.length; i++) {
                    touchPoints.push({
                        x: touches[i].x,
                        y: touches[i].y,
                        size: random(80, 180),
                        lifespan: 1.0
                    });
                }
            }
        }


        function createSurprise() {
            // Create ripple effect
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    particles.push(new Particle(
                        random(width),
                        random(height),
                        random(8, 15),
                        color(0, 80, 100)
                    ));
                }, i * 80);
            }
            
            // Reset particles with new properties
            particles = particles.map(p => {
                p.vel.mult(random(0.8, 1.2));
                p.maxSpeed = random(1.5, 3);
                return p;
            });
        }


        class Particle {
            constructor(x, y, size, col) {
                this.pos = createVector(x || random(width), y || random(height));
                this.vel = p5.Vector.random2D().mult(random(0.5, 1.5));
                this.acc = createVector();
                this.size = size || random(3, 8);
                this.baseHue = col?.levels[0] || random(180, 300);
                this.trail = [];
                this.maxTrail = 8;
                this.maxSpeed = random(1, 2.5);
            }


            applyForce(force) {
                this.acc.add(force);
            }


            applyAudioEnergy(energy) {
                // Pulsing effect based on audio
                this.size = map(energy, 0, 1, this.size * 0.8, this.size * 1.4);
                this.hueShift = map(energy, 0, 1, 0, 40);
            }


            update() {
                // Save position for trail
                this.trail.push({...this.pos});
                if (this.trail.length > this.maxTrail) this.trail.shift();
                
                // Update physics
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);
                
                // Boundary wrapping with easing
                if (this.pos.x > width + 50) this.pos.x = -50;
                if (this.pos.x < -50) this.pos.x = width + 50;
                if (this.pos.y > height + 50) this.pos.y = -50;
                if (this.pos.y < -50) this.pos.y = height + 50;
                
                // Gradually return to base size
                this.size = lerp(this.size, this.size * 0.9, 0.1);
            }


            display() {
                // Draw trail
                for (let i = 0; i < this.trail.length; i++) {
                    const pos = this.trail[i];
                    const alpha = map(i, 0, this.trail.length, 0.2, 0);
                    const trailSize = map(i, 0, this.trail.length, this.size * 0.3, this.size);
                    
                    fill(this.baseHue + this.hueShift || 0, 
                         80, 
                         100, 
                         alpha * 0.7);
                    ellipse(pos.x, pos.y, trailSize);
                }
                
                // Draw main particle
                fill(this.baseHue + this.hueShift || 0, 
                     90, 
                     100, 
                     0.9);
                ellipse(this.pos.x, this.pos.y, this.size);
                
                // Add subtle core highlight
                fill(0, 0, 100, 0.3);
                ellipse(this.pos.x, this.pos.y, this.size * 0.4);
            }
        }


        // Handle iOS orientation changes
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                resizeCanvas(windowWidth, windowHeight);
            }, 300);
        });
    </script>
</body>
</html>
